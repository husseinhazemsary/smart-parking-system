spring.application.name=smart-parking
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000

# Share links
app.share.base-url=https://ezrakna.app/lots

# Debug
logging.level.org.springframework.security=DEBUG

# OAuth2
app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.apple.client-id=${APPLE_CLIENT_ID}
