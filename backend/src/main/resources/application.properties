spring.application.name=smart-parking
server.port=8081

# Database
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:ocr_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.access-token-expiration=900000

# Share links
app.share.base-url=https://ezrakna.app/lots

# Debug
logging.level.org.springframework.security=DEBUG

# OAuth2
app.oauth.google.client-id=${GOOGLE_CLIENT_ID}
app.oauth.apple.client-id=${APPLE_CLIENT_ID}

# LPR service (internal Python FastAPI)
lpr.service.url=http://localhost:8001

# Invitation (set INVITATION_BASE_URL to the admin dashboard origin in production)
app.invitation.base-url=${INVITATION_BASE_URL:http://localhost:5174}

# Mail (set MAIL_ENABLED=true and provide SMTP env vars to send real emails;
# when disabled, invitation URLs are printed to the application log)
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_SMTP_STARTTLS:false}
